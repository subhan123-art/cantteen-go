<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Canteen Go — Staff</title>
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
    }
    window.addEventListener('resize', setAppHeight);
    window.addEventListener('orientationchange', setAppHeight);
    setAppHeight();
  })();
</script>
</head>
<body>
<div class="app-shell">

  <!-- ===================== HEADER ===================== -->
  <header class="app-header">
    <div class="brand-mark">
      <svg class="brand-logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" fill="#2F7A5C"/>
        <path d="M12 14c0-1.1.9-2 2-2s2 .9 2 2v6a3 3 0 0 1-2 2.83V27a1 1 0 1 1-2 0v-4.17A3 3 0 0 1 10 20v-6c0-1.1.9-2 2-2z" fill="#fff" opacity="0.95"/>
        <path d="M25 12c2.5 0 4 2.2 4 5s-1.5 5-3 5.4V27a1 1 0 1 1-2 0v-4.6c-1-.3-2-1.4-2-3.4v-4c0-1.7 1.3-3 3-3z" fill="#fff" opacity="0.95"/>
        <circle cx="20" cy="20" r="19" stroke="#fff" stroke-opacity="0.15"/>
      </svg>
      <div>
        <div class="brand-name">Canteen Go</div>
        <div class="brand-sub">Staff dashboard</div>
      </div>
    </div>
    <button class="status-pill open" id="canteen-toggle-btn"><span class="status-dot"></span>Open</button>
  </header>

  <main class="app-content">

  <!-- ===================== QUEUE SCREEN ===================== -->
  <section class="screen active" id="screen-queue">
    <div class="staff-summary">
      <div class="summary-card new-c"><div class="n" id="sum-new">0</div><div class="l">New</div></div>
      <div class="summary-card prep-c"><div class="n" id="sum-preparing">0</div><div class="l">Preparing</div></div>
      <div class="summary-card ready-c"><div class="n" id="sum-ready">0</div><div class="l">Ready</div></div>
      <div class="summary-card done-c"><div class="n" id="sum-completed">0</div><div class="l">Done today</div></div>
    </div>

    <div class="staff-filters" id="staff-filters">
      <button class="category-tab active" data-filter="new">New</button>
      <button class="category-tab" data-filter="preparing">Preparing</button>
      <button class="category-tab" data-filter="ready">Ready</button>
      <button class="category-tab" data-filter="completed">Completed</button>
    </div>

    <div id="daily-summary-wrap" class="hidden"></div>

    <div id="queue-list"></div>
  </section>

  <!-- ===================== AVAILABILITY SCREEN ===================== -->
  <section class="screen" id="screen-availability">
    <h3 style="font-size:16px; margin-bottom:4px;">Food availability</h3>
    <p class="small muted" style="margin-bottom:16px;">Toggle items off the moment you run out — students see it instantly.</p>
    <div id="availability-list"></div>

    <div class="section-title">Add a new item</div>
    <div class="card" style="padding:14px 16px;">
      <div class="field-label">Name</div>
      <input type="text" class="text-input" id="new-item-name" placeholder="e.g. Paneer Roll">
      <div style="display:flex; gap:10px;">
        <div style="flex:1;">
          <div class="field-label">Category</div>
          <select class="text-input" id="new-item-cat">
            <option>Snacks</option><option>Meals</option><option>Drinks</option>
          </select>
        </div>
        <div style="flex:1;">
          <div class="field-label">Price (₹)</div>
          <input type="number" class="text-input" id="new-item-price" placeholder="50">
        </div>
      </div>
      <button class="cta-btn" id="btn-add-item" style="margin-top:14px;">Add Item</button>
    </div>
  </section>

  <!-- ===================== FEEDBACK SCREEN ===================== -->
  <section class="screen" id="screen-feedback">
    <h3 style="font-size:16px; margin-bottom:4px;">Student feedback</h3>
    <p class="small muted" style="margin-bottom:16px;">Ratings students left after collecting their order.</p>

    <div class="card rating-summary-card" id="rating-summary"></div>

    <div class="section-title">Recent feedback</div>
    <div id="feedback-list"></div>
  </section>

  </main>

  <!-- ===================== BOTTOM NAV ===================== -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="queue"><span class="nav-icon">🎫</span>Order Queue</button>
    <button class="nav-btn" data-screen="availability"><span class="nav-icon">🍽️</span>Availability</button>
    <button class="nav-btn" data-screen="feedback"><span class="nav-icon">⭐</span>Feedback</button>
  </nav>

  <div class="toast" id="toast"><span class="dot"></span><span id="toast-text"></span></div>

</div>
<script src="data.js"></script>
<script src="staff.js"></script>
</body>
</html>
